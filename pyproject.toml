[project]
name = "aioebus"
version = "0.1.0"
description = "Standalone async eBUS library (decode-first). No ebusd daemon required."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "dneprojects", email = "dne.projects.1@gmail.com" }]
keywords = ["ebus", "ebusd", "vaillant", "heating", "home-assistant", "asyncio"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/dneprojects/aioebus"
Repository = "https://github.com/dneprojects/aioebus"
Issues = "https://github.com/dneprojects/aioebus/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aioebus = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
